services:
  web:
    container_name: "wp_development_nginx"
    image: nginx:latest
    volumes:
      - "./config/nginx.conf:/etc/nginx/conf.d/default.conf"
      - "./wordpress:/var/www/html"
    ports:
      - "8400:80"
    restart: always
    depends_on:
      - php_fpm
      - database
  php_fpm:
    container_name: "wp_development_php_fpm"
    build:
      context: .
      dockerfile: ./config/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASS: "${DB_PASS}"
      LOCAL_WEB: "${LOCAL_WEB}"
      PHP_IDE_CONFIG: "serverName=localhost"
    command: ["/var/www/entrypoint.sh"]
    volumes:
      - "./scripts/entrypoint.sh:/var/www/entrypoint.sh"
      - "./config/php.ini:/usr/local/etc/php/conf.d/php.ini"
      - "./config/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini"
      - "./wordpress:/var/www/html"
      - "./src:/var/www/html/wp-content/plugins/wordpress-plugin-boilerplate/src"
      - "./vendor:/var/www/html/wp-content/plugins/wordpress-plugin-boilerplate/vendor"
      - "./wordpress-plugin-boilerplate.php:/var/www/html/wp-content/plugins/wordpress-plugin-boilerplate/wordpress-plugin-boilerplate.php"
    depends_on:
      - database
    links:
      - database
  pma:
    container_name: "wp_development_phpmyadmin"
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: "${DB_PASS}"
    restart: always
    depends_on:
      - database
  database:
    container_name: "wp_development_database"
    image: mariadb:10.5.12
    ports:
      - "3306:3306"
    command:
      [
        "--default_authentication_plugin=mysql_native_password",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--max_allowed_packet=65011712",
      ]
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_ROOT_PASSWORD: "${DB_PASS}"
volumes:
  db_data:
